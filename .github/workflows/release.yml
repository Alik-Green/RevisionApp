name: Release

# Publishes the Windows x86-64 installer and the Android debug APK to a GitHub
# Release. Triggered by pushing a `v*` tag, or manually once the workflow lives
# on the default branch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  windows:
    name: Windows x86-64 installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # jpackage builds the .exe through the WiX toolset (candle.exe/light.exe),
      # which the windows-latest image ships but does not always put on PATH.
      - name: Put WiX Toolset v3 on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $roots = @(
            'C:\Program Files (x86)\WiX Toolset v3.14\bin',
            'C:\Program Files (x86)\WiX Toolset v3.11\bin'
          )
          $found = $roots | Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1
          if (-not $found) {
            $found = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' |
              ForEach-Object { Join-Path $_.FullName 'bin' } |
              Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1
          }
          if (-not $found) {
            Write-Host 'WiX not found, installing via Chocolatey'
            choco install wixtoolset --version=3.14.1 -y --no-progress
            $found = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          }
          Write-Host "Using WiX at $found"
          Add-Content -Path $env:GITHUB_PATH -Value $found

      - name: Package the Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          ./gradlew.bat :desktopApp:packageExe --stacktrace 2>&1 |
            Tee-Object -FilePath logs/30-package-exe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The app runs on a jlink image containing only the modules the build file
      # lists, so a missing module is invisible to every other check: the code
      # compiles, `:desktopApp:run` works on the full JDK, packaging succeeds, and
      # the installer then dies at startup. v1.0.0 shipped exactly that failure
      # with java.sql, so assert the bundled runtime carries what the app needs.
      - name: Verify the bundled runtime has the required modules
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $required = @('java.base', 'java.desktop', 'java.logging', 'java.sql', 'jdk.crypto.ec')
          # jlink writes a legal/<module> directory for every module it links, so
          # that listing is the authoritative record of what the packaged app runs
          # on. Asserting on it does not depend on locating the runtime image,
          # which an earlier version of this check did and got wrong.
          $linked = @(Get-ChildItem -Recurse -Path desktopApp/build/compose -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Parent.Name -eq 'legal' } |
            ForEach-Object { $_.Name } | Sort-Object -Unique)
          $missing = @($required | Where-Object { $_ -notin $linked })
          $out = @()
          $out += "modules linked into the packaged runtime: $($linked.Count)"
          $out += $linked
          $out += "required: $($required -join ', ')"
          $out += "MISSING: $(if ($missing.Count) { $missing -join ', ' } else { '(none)' })"
          $java = Get-ChildItem -Recurse -Path desktopApp/build/compose -Filter java.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($java) {
            $out += "bundled launcher: $($java.FullName)"
            $out += @(& $java.FullName --list-modules 2>&1 | ForEach-Object { "$_" })
          } else {
            $out += 'no java.exe found under desktopApp/build/compose (informational only)'
          }
          $out | Tee-Object -FilePath logs/50-windows-runtime.log | Out-Null
          if ($linked.Count -eq 0) { throw 'no jlink runtime image found under desktopApp/build/compose' }
          if ($missing.Count -gt 0) { throw "bundled runtime is missing: $($missing -join ', ')" }
          Write-Host "all required modules present: $($required -join ', ')"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: |
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/report-failure.sh "${{ github.job }}"

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licences and install the compile SDK
        run: |
          set -u
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER=""
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-37" >/dev/null 2>&1 || true
          fi

      - name: Assemble debug APK
        run: |
          mkdir -p logs
          ./gradlew :androidApp:assembleDebug --stacktrace 2>&1 | tee logs/40-android-release.log

      - name: Rename APK
        run: |
          cd androidApp/build/outputs/apk/debug
          cp androidApp-debug.apk RevisionApp-android-debug.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/RevisionApp-android-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/report-failure.sh "${{ github.job }}"

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, android]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: |
          cd dist
          find . -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.apk' \) -exec sha256sum {} + \
            | sed 's|\./||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES="Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%dT%H:%M:%SZ) by the Release workflow.

          Assets:
          - \`RevisionApp-<version>.exe\` - Windows x86-64 installer (jpackage/WiX)
          - \`RevisionApp-android-debug.apk\` - Android debug build

          See \`SHA256SUMS.txt\` for checksums."
          # Collected with find rather than shell globs: an unmatched glob would
          # pass a literal "*.msi" to gh and fail the step, and only the .exe is
          # built today. Whatever packaging produced is what gets published.
          mapfile -t ASSETS < <(find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.apk' \) | sort)
          ASSETS+=("dist/SHA256SUMS.txt")
          printf 'publishing %s asset(s)\n' "${#ASSETS[@]}"
          gh release create "$TAG" \
            --title "RevisionApp $TAG" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            "${ASSETS[@]}" \
            2>/dev/null || \
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/report-failure.sh "${{ github.job }}"
