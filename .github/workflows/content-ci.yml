name: Content

on:
  push:
    branches:
      - content
  pull_request:
    branches:
      - content
  workflow_dispatch:

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate content packs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install --upgrade pip jsonschema

      # Structural checks, JSON Schema, unique ids, resolvable topic and tag
      # references, well-formed MCQ, tile answers that reconstruct the model
      # answer, and at least five cards per leaf topic.
      - name: Validate every pack
        run: python tools/validate

      # The validator checks itself against tools/fixtures: one file per defect it
      # is supposed to catch, plus a valid control that must produce nothing. A
      # rule that stops firing then fails CI instead of silently letting corrupt
      # content through.
      - name: Prove the validator catches what it claims to
        run: python tools/validate --selftest

      # The manifest promises a hash per pack; a stale one makes the app reject
      # the download, so recompute it and fail if the committed copy disagrees.
      - name: Confirm the committed hashes are current
        run: |
          python tools/validate --update-hashes
          if ! git diff --quiet -- manifest.json; then
            echo "::error::manifest.json is stale - run tools/validate --update-hashes and commit"
            git --no-pager diff -- manifest.json
            exit 1
          fi
          echo "manifest hashes are current"
