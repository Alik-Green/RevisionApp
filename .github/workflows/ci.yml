name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  desktop:
    name: Tests + lint + desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every check runs even if an earlier one fails, so a single push reports
      # compile errors, test failures and lint violations together. Feedback here
      # costs a whole CI round trip, so batching it matters. See docs/DECISIONS.md D1.
      - name: Configure, test, lint and build
        shell: bash
        run: |
          mkdir -p logs
          status=0
          run_step() {
            name="$1"; shift
            echo "::group::$name"
            if "$@" 2>&1 | tee "logs/$name.log"; then
              echo "$name: OK"
            else
              echo "$name: FAILED"
              status=1
            fi
            echo "::endgroup::"
          }
          run_step 00-configure ./gradlew projects --stacktrace
          run_step 10-test ./gradlew :composeApp:desktopTest --stacktrace
          run_step 20-lint ./gradlew ktlintCheck --stacktrace
          run_step 30-desktop ./gradlew :desktopApp:build --stacktrace
          exit $status

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/report-failure.sh "${{ github.job }}"

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            logs/
            composeApp/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences and install the compile SDK
        shell: bash
        run: |
          set -u
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER=""
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found, relying on AGP auto-download"
            exit 0
          fi
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37" >/dev/null 2>&1 || \
            echo "::warning::could not pre-install platforms;android-37"

      - name: Assemble debug APK
        shell: bash
        run: |
          mkdir -p logs
          ./gradlew :androidApp:assembleDebug --stacktrace 2>&1 | tee logs/40-android.log

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/report-failure.sh "${{ github.job }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
